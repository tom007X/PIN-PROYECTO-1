name: CI/CD Pipeline - Proyecto 1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: api-clientes

jobs:
  # ========== JOB 1: TEST + SEGURIDAD ==========
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Recomendado por Sonar para mejor análisis

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      # Test básico 
      - name: Ejecutar tests
        run: pytest --cov=. --cov-report=xml || true

      # Cache de Sonar para acelerar el escaneo
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # SonarQube Scan (acción actualizada)
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=coverage.xml
       
        # continue-on-error: true

      # Snyk para escanear dependencias
      - name: Snyk Security Scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
        #continue-on-error: true

  # ========== JOB 2: BUILD + SBOM ==========
  build-and-sbom:
    needs: test-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Build imagen Docker
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # Guardar la imagen como artifact (formato tar)
      - name: Guardar imagen como artifact
        run: docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} -o ${{ env.IMAGE_NAME }}.tar

      - name: Subir imagen como artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ env.IMAGE_NAME }}.tar

      # Generar SBOM con Syft (CycloneDX) - Más confiable para Python
      - name: Generar SBOM CycloneDX con Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false 

      - name: Subir SBOM como artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error 