global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-clientes'
    metrics_path: /metrics
    static_configs:
      # host.docker.internal permite al contenedor de Prometheus
      # alcanzar el puerto 8080 del host (donde Terraform levantó la app)
      - targets: ['host.docker.internal:8080']